name: Build DreamSpace APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ./*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unit tests
        working-directory: DreamSpace
        run: gradle testDebugUnitTest
      - name: Build debug APK
        working-directory: DreamSpace
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DreamSpace-debug-apk
          path: DreamSpace/app/build/outputs/apk/debug/app-debug.apk
